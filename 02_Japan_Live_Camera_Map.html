<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本即時攝影機地圖 | Japan Live Camera Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html, body { min-height: 100%; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0f172a; color: #f8fafc; border: 1px solid #334155; }
        .leaflet-container { font: inherit; background: #0b1220; }
        .camera-layout { grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 1280px) {
            .camera-layout { grid-template-columns: minmax(0, 65fr) minmax(360px, 35fr); }
        }
        .leaflet-div-icon.camera-emoji-marker { background: transparent; border: 0; }
        .camera-emoji-marker { display: grid; place-items: center; font-size: 23px; line-height: 1; filter: drop-shadow(0 1px 2px #020617); }
        .camera-emoji-marker.selected { transform: scale(1.25); filter: drop-shadow(0 0 5px #fb7185); z-index: 1000 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col font-sans antialiased">
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 shrink-0">
        <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <a href="index.html" title="返回控制中心" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
                <div>
                    <h1 class="font-bold text-lg">日本即時攝影機地圖</h1>
                    <p class="text-xs text-slate-400">點選地圖標記載入 YouTube 直播或影片</p>
                </div>
            </div>
            <div class="text-xs text-slate-400 flex items-center gap-2"><i data-lucide="map" class="w-4 h-4 text-emerald-400"></i> OpenStreetMap <span class="text-slate-600">•</span> <span id="loadStatus">載入攝影機資料中…</span></div>
        </div>
    </header>

    <main class="flex-1 max-w-[1920px] w-full mx-auto p-3 sm:p-4 flex flex-col gap-3 min-h-0">
        <section class="flex flex-wrap items-center gap-2 rounded-xl border border-slate-800 bg-slate-900 p-3">
            <label class="relative flex-1 min-w-[190px]">
                <span class="sr-only">搜尋攝影機</span>
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input id="searchInput" type="search" placeholder="搜尋地點、名稱或地區" class="w-full rounded-lg border border-slate-700 bg-slate-950 py-2 pl-9 pr-3 text-sm outline-none focus:border-indigo-500">
            </label>
            <button id="recenterBtn" class="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm hover:bg-slate-700 flex items-center gap-2"><i data-lucide="locate-fixed" class="w-4 h-4"></i>顯示全部</button>
            <span id="resultCount" class="text-xs text-slate-400 px-1">—</span>
        </section>

        <section class="camera-layout flex-1 grid grid-cols-1 gap-3 min-h-0">
            <div class="relative h-[70vh] min-h-[560px] rounded-xl border border-slate-800 overflow-hidden bg-slate-900">
                <div id="map" class="absolute inset-0"></div>
                <div id="categoryControl" class="absolute top-3 left-3 z-[1000] max-w-[calc(100%-5rem)]">
                    <button id="categoryMenuButton" type="button" aria-expanded="false" aria-controls="categoryMenuPanel" class="rounded-lg border border-slate-700 bg-slate-900/95 px-3 py-2 text-sm font-medium text-white shadow-lg hover:bg-slate-800 flex items-center gap-2">
                        <i data-lucide="list-filter" class="w-4 h-4 text-emerald-300"></i>分類篩選 <span id="categorySelectionCount" class="text-xs text-slate-400"></span>
                    </button>
                    <div id="categoryMenuPanel" class="hidden mt-2 w-72 max-w-[calc(100vw-3rem)] max-h-[60vh] overflow-y-auto rounded-xl border border-slate-700 bg-slate-900/95 p-3 shadow-2xl" role="group" aria-label="地圖分類篩選">
                        <div class="sticky top-0 z-10 -mx-1 -mt-1 mb-2 flex gap-2 bg-slate-900 p-1">
                            <button type="button" data-category-action="select-all" class="flex-1 rounded-md bg-emerald-700/80 px-2 py-1.5 text-xs font-medium text-white hover:bg-emerald-600">全選</button>
                            <button type="button" data-category-action="deselect-all" class="flex-1 rounded-md bg-slate-800 px-2 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-700">全不選</button>
                        </div>
                        <div id="categoryTree" class="space-y-2"></div>
                    </div>
                </div>
                <div id="gpsControl" class="absolute top-3 right-3 z-[1000] flex flex-col items-end gap-2">
                    <button id="gpsButton" type="button" class="rounded-lg border border-slate-700 bg-slate-900/95 px-3 py-2 text-sm font-medium text-white shadow-lg hover:bg-slate-800 disabled:cursor-wait disabled:opacity-70 flex items-center gap-2" aria-label="使用裝置定位並移至目前位置" title="使用裝置定位並移至目前位置">
                        <i data-lucide="locate-fixed" class="w-4 h-4 text-sky-300"></i><span>我的位置</span>
                    </button>
                    <p id="gpsStatus" class="hidden max-w-56 rounded-lg border border-slate-700 bg-slate-900/95 px-3 py-2 text-xs text-slate-200 shadow-lg" role="status" aria-live="polite"></p>
                </div>
                <div id="mapError" class="hidden absolute inset-0 z-[500] bg-slate-950/95 p-6 flex items-center justify-center text-center text-sm text-rose-300"></div>
            </div>
            <aside class="h-[70vh] min-h-[560px] rounded-xl border border-slate-800 bg-slate-900 overflow-hidden flex flex-col">
                <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <h2 class="text-sm font-semibold flex items-center gap-2"><i data-lucide="radio" class="w-4 h-4 text-rose-400"></i> YouTube 即時影像</h2>
                    <span id="selectedIndex" class="font-mono text-xs text-slate-500"></span>
                </div>
                <div class="relative w-full aspect-video bg-black">
                    <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-center text-slate-500 p-6">
                        <i data-lucide="video" class="w-8 h-8"></i><p class="text-sm">請點選地圖上的攝影機</p>
                    </div>
                    <iframe id="youtubePlayer" class="hidden absolute inset-0 w-full h-full border-0" title="YouTube 即時影像" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="p-4 flex-1 flex flex-col gap-3">
                    <div>
                        <h3 id="cameraTitle" class="font-semibold leading-snug">尚未選取攝影機</h3>
                        <p id="cameraLocation" class="text-xs text-slate-400 mt-1"></p>
                    </div>
                    <div id="cameraCategories" class="flex flex-wrap gap-1.5"></div>
                    <p id="playerMessage" class="text-xs text-slate-500 leading-relaxed">選取標記後，若資料有直播影片或頻道 ID，播放器會嘗試載入。部分頻道不允許嵌入播放。</p>
                    <div class="mt-auto flex flex-wrap gap-2 text-xs">
                        <a id="youtubeLink" class="hidden rounded-lg bg-rose-600 hover:bg-rose-500 px-3 py-2 font-medium text-white" target="_blank" rel="noopener noreferrer">在 YouTube 開啟</a>
                        <a id="sourceLink" class="hidden rounded-lg border border-slate-700 hover:bg-slate-800 px-3 py-2 text-slate-300" target="_blank" rel="noopener noreferrer">Cametan 原始頁</a>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900/70 px-4 py-2 text-center text-xs text-slate-500">
        地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-300">OpenStreetMap</a> 貢獻者 • 攝影機來源 Cametan • 影片來源 YouTube
    </footer>

    <script>
        lucide.createIcons();

        const DATA_URL = './dB/map_embeded_db.json';
        const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([36.2, 138.2], 5);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);
        const userLocationLayer = L.layerGroup().addTo(map);
        let records = [];
        let taxonomyNames = {};
        let allBounds = null;
        let categoryGroups = {};
        let allCategoryIds = [];
        let selectedCategoryIds = new Set();
        let activeRecordIndex = '';
        let activeMarker = null;

        const UNCATEGORIZED_ID = '__uncategorized__';
        const groupEmoji = { A: '🌿', B: '🏙️', C: '🚦' };
        const categoryEmoji = {
            'A.1': '🏖️', 'A.2': '🌊', 'A.3': '⛰️', 'A.4': '🎿', 'A.5': '🐾', 'A.6': '🌸', 'A.7': '🍁',
            'B.1': '🏙️', 'B.2': '🌃', 'B.3': '⛩️',
            'C.1': '🛣️', 'C.2': '🚆', 'C.3': '✈️'
        };

        const elements = {
            status: document.getElementById('loadStatus'),
            count: document.getElementById('resultCount'),
            search: document.getElementById('searchInput'),
            categoryTree: document.getElementById('categoryTree'),
            categoryMenu: document.getElementById('categoryMenuPanel'),
            categoryMenuButton: document.getElementById('categoryMenuButton'),
            categorySelectionCount: document.getElementById('categorySelectionCount'),
            gpsButton: document.getElementById('gpsButton'),
            gpsStatus: document.getElementById('gpsStatus'),
            error: document.getElementById('mapError'),
            player: document.getElementById('youtubePlayer'),
            placeholder: document.getElementById('playerPlaceholder'),
            title: document.getElementById('cameraTitle'),
            location: document.getElementById('cameraLocation'),
            categories: document.getElementById('cameraCategories'),
            message: document.getElementById('playerMessage'),
            index: document.getElementById('selectedIndex'),
            youtubeLink: document.getElementById('youtubeLink'),
            sourceLink: document.getElementById('sourceLink')
        };

        L.DomEvent.disableClickPropagation(document.getElementById('categoryControl'));
        L.DomEvent.disableScrollPropagation(document.getElementById('categoryControl'));
        L.DomEvent.disableClickPropagation(document.getElementById('gpsControl'));

        function categoryLabel(id) {
            return taxonomyNames[id] || id;
        }

        function updateCategoryControls() {
            for (const [groupId, ids] of Object.entries(categoryGroups)) {
                const checkbox = elements.categoryTree.querySelector(`[data-group-id="${groupId}"]`);
                const selectedCount = ids.filter(id => selectedCategoryIds.has(id)).length;
                checkbox.checked = selectedCount === ids.length;
                checkbox.indeterminate = selectedCount > 0 && selectedCount < ids.length;
            }
            const allIds = [...allCategoryIds, UNCATEGORIZED_ID];
            const selectedCount = allIds.filter(id => selectedCategoryIds.has(id)).length;
            elements.categorySelectionCount.textContent = `${selectedCount}/${allIds.length}`;
        }

        function setCategories(ids, selected) {
            for (const id of ids) {
                if (selected) selectedCategoryIds.add(id);
                else selectedCategoryIds.delete(id);
            }
            updateCategoryControls();
            applyFilters();
        }

        function buildCategoryMenu(taxonomy) {
            elements.categoryTree.replaceChildren();
            categoryGroups = {};
            taxonomyNames = {};

            for (const [groupId, group] of Object.entries(taxonomy)) {
                const ids = Object.keys(group.subcategories || {});
                categoryGroups[groupId] = ids;
                allCategoryIds.push(...ids);

                const section = document.createElement('section');
                section.className = 'rounded-lg border border-slate-800 bg-slate-950/60 p-2';
                const heading = document.createElement('label');
                heading.className = 'flex cursor-pointer items-center gap-2 rounded-md px-1 py-1.5 text-sm font-semibold text-slate-100 hover:bg-slate-800';
                const groupCheckbox = document.createElement('input');
                groupCheckbox.type = 'checkbox';
                groupCheckbox.dataset.groupId = groupId;
                groupCheckbox.className = 'h-4 w-4 accent-emerald-500';
                const groupTitle = document.createElement('span');
                groupTitle.className = 'flex-1';
                groupTitle.textContent = `${groupEmoji[groupId] || '📂'} ${group.name || groupId}`;
                const levelOne = document.createElement('span');
                levelOne.className = 'text-[10px] font-normal text-slate-500';
                levelOne.textContent = `Lv1 · ${ids.length}`;
                heading.append(groupCheckbox, groupTitle, levelOne);
                section.append(heading);

                const children = document.createElement('div');
                children.className = 'ml-6 mt-1 space-y-0.5 border-l border-slate-700 pl-2';
                for (const [id, value] of Object.entries(group.subcategories || {})) {
                    const name = typeof value === 'string' ? value : (value.name || id);
                    taxonomyNames[id] = `${categoryEmoji[id] || '📍'} ${name}`;
                    const label = document.createElement('label');
                    label.className = 'flex cursor-pointer items-center gap-2 rounded-md px-1 py-1 text-xs text-slate-300 hover:bg-slate-800';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.dataset.categoryId = id;
                    checkbox.className = 'h-3.5 w-3.5 accent-indigo-400';
                    const text = document.createElement('span');
                    text.className = 'flex-1';
                    text.textContent = taxonomyNames[id];
                    const levelTwo = document.createElement('span');
                    levelTwo.className = 'text-[9px] text-slate-600';
                    levelTwo.textContent = id;
                    label.append(checkbox, text, levelTwo);
                    children.append(label);
                }
                section.append(children);
                elements.categoryTree.append(section);
            }

            const unknownLabel = document.createElement('label');
            unknownLabel.className = 'flex cursor-pointer items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800';
            const unknownCheckbox = document.createElement('input');
            unknownCheckbox.type = 'checkbox';
            unknownCheckbox.dataset.categoryId = UNCATEGORIZED_ID;
            unknownCheckbox.className = 'h-3.5 w-3.5 accent-indigo-400';
            const unknownText = document.createElement('span');
            unknownText.textContent = '❔ 未分類';
            unknownLabel.append(unknownCheckbox, unknownText);
            elements.categoryTree.append(unknownLabel);

            selectedCategoryIds = new Set([...allCategoryIds, UNCATEGORIZED_ID]);
            elements.categoryTree.addEventListener('change', event => {
                const target = event.target;
                if (target.dataset.groupId) {
                    setCategories(categoryGroups[target.dataset.groupId], target.checked);
                } else if (target.dataset.categoryId) {
                    setCategories([target.dataset.categoryId], target.checked);
                }
            });
            elements.categoryTree.parentElement.querySelectorAll('[data-category-action]').forEach(button => {
                button.addEventListener('click', () => setCategories(
                    [...allCategoryIds, UNCATEGORIZED_ID], button.dataset.categoryAction === 'select-all'
                ));
            });
            updateCategoryControls();
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function popupContent(record) {
            const wrap = document.createElement('div');
            wrap.className = 'min-w-44';
            const title = document.createElement('strong');
            title.className = 'block text-sm mb-1';
            title.textContent = record.name || record.location?.name || `Camera ${record.mapIndex}`;
            const location = document.createElement('span');
            location.className = 'block text-xs text-slate-300';
            location.textContent = [record.location?.locality, record.location?.region].filter(Boolean).join('、');
            const action = document.createElement('span');
            action.className = 'block text-xs text-emerald-300 mt-2';
            action.textContent = '已在右側載入影像';
            wrap.append(title, location, action);
            return wrap;
        }

        function getPlayerSource(record) {
            const video = (record.youtube?.videos || []).find(item => /^[\w-]{11}$/.test(item.videoId || ''));
            if (video) {
                return {
                    embed: `https://www.youtube.com/embed/${encodeURIComponent(video.videoId)}?autoplay=1&mute=1&playsinline=1`,
                    link: video.url || `https://www.youtube.com/watch?v=${encodeURIComponent(video.videoId)}`,
                    message: '已載入資料庫中的 YouTube 影片。播放器以靜音自動播放；可在播放器中取消靜音。'
                };
            }
            const channel = (record.youtube?.channels || []).find(item => item.id && /^[\w-]{20,30}$/.test(item.id));
            if (channel) {
                return {
                    embed: `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(channel.id)}&autoplay=1&mute=1&playsinline=1`,
                    link: channel.url || `https://www.youtube.com/channel/${encodeURIComponent(channel.id)}/live`,
                    message: '此攝影機沒有固定影片 ID，播放器會嘗試播放該頻道目前的直播。若目前沒有直播或頻道限制嵌入，請使用 YouTube 連結。'
                };
            }
            const channelUrl = record.youtube?.channels?.find(item => item.url)?.url;
            return {
                embed: '',
                link: channelUrl || record.youtube?.videos?.[0]?.url || '',
                message: channelUrl ? '資料只有頻道連結，沒有可直接嵌入的影片 ID；請在 YouTube 開啟頻道直播。' : '此攝影機資料沒有可用的 YouTube 播放或頻道連結。'
            };
        }

        function selectRecord(record, marker) {
            activeRecordIndex = record.mapIndex;
            if (activeMarker?._icon) activeMarker._icon.classList.remove('selected');
            activeMarker = marker;
            if (activeMarker?._icon) activeMarker._icon.classList.add('selected');
            elements.player.src = '';
            const source = getPlayerSource(record);
            elements.title.textContent = record.name || record.location?.name || `Camera ${record.mapIndex}`;
            elements.location.textContent = [record.location?.name, record.location?.locality, record.location?.region].filter(Boolean).join(' · ');
            elements.index.textContent = `#${record.mapIndex}`;
            elements.message.textContent = source.message;
            elements.categories.replaceChildren();
            for (const id of record.categoryIds || []) {
                const badge = document.createElement('span');
                badge.className = 'rounded-full border border-indigo-500/30 bg-indigo-500/10 px-2 py-1 text-[11px] text-indigo-200';
                badge.textContent = categoryLabel(id);
                elements.categories.append(badge);
            }
            if (source.embed) {
                elements.player.src = source.embed;
                elements.player.classList.remove('hidden');
                elements.placeholder.classList.add('hidden');
            } else {
                elements.player.classList.add('hidden');
                elements.placeholder.classList.remove('hidden');
                elements.placeholder.querySelector('p').textContent = '此記錄沒有可嵌入的影片 ID';
            }
            elements.youtubeLink.href = source.link || '#';
            elements.youtubeLink.classList.toggle('hidden', !source.link);
            elements.sourceLink.href = record.source?.url || '#';
            elements.sourceLink.classList.toggle('hidden', !record.source?.url);
            if (marker) marker.openPopup();
        }

        function matches(record, query) {
            if (!query) return true;
            const searchText = [record.name, record.location?.name, record.location?.locality, record.location?.region,
                ...(record.tags || []).flatMap(tag => [tag.value, tag.normalized]),
                ...(record.categoryIds || []).map(categoryLabel)].filter(Boolean).join(' ').toLocaleLowerCase();
            return searchText.includes(query);
        }

        function applyFilters() {
            const query = elements.search.value.trim().toLocaleLowerCase();
            markerLayer.clearLayers();
            let visible = 0;
            for (const record of records) {
                if (!matches(record, query)) continue;
                const categories = record.categoryIds || [];
                const categoryIsSelected = categories.length
                    ? categories.some(id => selectedCategoryIds.has(id))
                    : selectedCategoryIds.has(UNCATEGORIZED_ID);
                if (!categoryIsSelected) continue;
                const lat = Number(record.location?.latitude);
                const lng = Number(record.location?.longitude);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
                const primaryCategoryId = (record.categoryIds || [])[0];
                const markerEmoji = categoryEmoji[primaryCategoryId] || '📍';
                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: `camera-emoji-marker${record.mapIndex === activeRecordIndex ? ' selected' : ''}`,
                        html: `<span aria-hidden="true">${markerEmoji}</span>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    }),
                    title: record.name || record.location?.name || record.mapIndex
                });
                marker.bindPopup(popupContent(record));
                marker.on('click', () => selectRecord(record, marker));
                marker.addTo(markerLayer);
                visible++;
            }
            elements.count.textContent = `顯示 ${visible} / ${records.length} 個地點`;
        }

        function showError(message) {
            elements.error.textContent = message;
            elements.error.classList.remove('hidden');
            elements.status.textContent = '資料載入失敗';
            elements.count.textContent = '—';
        }

        async function loadData() {
            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data.entries || !data.taxonomy) throw new Error('JSON 格式不符合預期');
                records = Object.values(data.entries);
                allCategoryIds = [];
                buildCategoryMenu(data.taxonomy);
                const points = records.filter(record => Number.isFinite(Number(record.location?.latitude)) && Number.isFinite(Number(record.location?.longitude)));
                if (!points.length) throw new Error('資料中沒有有效座標');
                allBounds = L.latLngBounds(points.map(record => [Number(record.location.latitude), Number(record.location.longitude)]));
                applyFilters();
                map.fitBounds(allBounds.pad(0.06), { maxZoom: 7 });
                elements.status.textContent = `已載入 ${records.length} 個地點`;
            } catch (error) {
                console.error('Could not load camera map database:', error);
                showError(`無法載入 ${DATA_URL}。請確認 dB/map_embeded_db.json 已一起部署，並透過 GitHub Pages 或本機網站伺服器開啟此頁。(${error.message})`);
            }
        }

        elements.search.addEventListener('input', applyFilters);
        elements.categoryMenuButton.addEventListener('click', () => {
            const isOpen = elements.categoryMenuButton.getAttribute('aria-expanded') === 'true';
            elements.categoryMenuButton.setAttribute('aria-expanded', String(!isOpen));
            elements.categoryMenu.classList.toggle('hidden', isOpen);
        });
        elements.gpsButton.addEventListener('click', () => {
            if (!('geolocation' in navigator)) {
                showGpsStatus('此瀏覽器不支援裝置定位。', true);
                return;
            }
            elements.gpsButton.disabled = true;
            elements.gpsButton.querySelector('span').textContent = '定位中…';
            showGpsStatus('正在取得裝置位置…');
            map.locate({
                setView: false,
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 10000
            });
        });
        map.on('locationfound', event => {
            userLocationLayer.clearLayers();
            L.circle(event.latlng, {
                radius: event.accuracy,
                color: '#38bdf8',
                weight: 1,
                fillColor: '#38bdf8',
                fillOpacity: 0.12
            }).addTo(userLocationLayer);
            L.circleMarker(event.latlng, {
                radius: 8,
                color: '#ffffff',
                weight: 3,
                fillColor: '#0284c7',
                fillOpacity: 1
            }).bindPopup(`目前位置<br><span class="text-xs">定位精度約 ±${Math.round(event.accuracy)} 公尺</span>`).addTo(userLocationLayer).openPopup();
            map.flyTo(event.latlng, Math.max(map.getZoom(), 16), { duration: 0.9 });
            elements.gpsButton.disabled = false;
            elements.gpsButton.querySelector('span').textContent = '我的位置';
            showGpsStatus(`已定位，精度約 ±${Math.round(event.accuracy)} 公尺`);
        });
        map.on('locationerror', event => {
            elements.gpsButton.disabled = false;
            elements.gpsButton.querySelector('span').textContent = '我的位置';
            const messages = {
                1: '定位權限未開啟，請允許此網站存取位置。',
                2: '目前無法取得裝置位置，請確認 GPS 或定位服務已開啟。',
                3: '定位逾時，請稍後再試。'
            };
            showGpsStatus(messages[event.code] || '無法取得裝置位置，請稍後再試。', true);
        });
        document.getElementById('recenterBtn').addEventListener('click', () => {
            if (allBounds) map.fitBounds(allBounds.pad(0.06), { maxZoom: 7 });
        });
        window.addEventListener('resize', () => map.invalidateSize());
        loadData();

        function showGpsStatus(message, isError = false) {
            elements.gpsStatus.textContent = message;
            elements.gpsStatus.classList.remove('hidden', 'text-slate-200', 'text-rose-300');
            elements.gpsStatus.classList.add(isError ? 'text-rose-300' : 'text-slate-200');
        }
    </script>
</body>
</html>
