function showDetail(placeId,stageIndex,content){const p=places.find(x=>x.id===placeId);if(!p||!content)return;activeGoalPlaceId=placeId;updateMapcodeLabels();content.replaceChildren();const type=document.createElement("p");type.className="node-kind";type.textContent=p.kind+" · "+p.time;const desc=document.createElement("p");desc.textContent=p.description;const coords=document.createElement("p");coords.className="node-coords";coords.textContent="GPS："+p.coords[0].toFixed(5)+", "+p.coords[1].toFixed(5);const mapcode=document.createElement("p");mapcode.className="node-mapcode";mapcode.textContent="車用 MapCode"+(p.mapcode_target?"（"+p.mapcode_target+"）":"")+"："+(p.mapcode||"未提供");mapcode.hidden=false;const links=document.createElement("div");links.className="node-links";[["在 OpenStreetMap 開啟",p.map],["在 Google 地圖開啟","https://www.google.com/maps/search/?api=1&query="+p.coords[0]+","+p.coords[1]]].forEach(([label,url])=>{const a=document.createElement("a");a.href=url;a.textContent=label;a.target="_blank";a.rel="noreferrer";links.append(a)});const officialHeading=document.createElement("p");officialHeading.className="node-kind";officialHeading.textContent="官方資訊（開放時間／聯絡方式）";const official=document.createElement("div");official.className="node-links";(p.official_links||[]).forEach(info=>{const a=document.createElement("a");a.href=info.url;a.textContent=info.label;a.target="_blank";a.rel="noreferrer";official.append(a)});if(p.coordinate_source){const gpsSource=document.createElement("a");gpsSource.href=p.coordinate_source;gpsSource.textContent="GPS 座標來源";gpsSource.target="_blank";gpsSource.rel="noreferrer";official.append(gpsSource)}if(p.mapping_source){const mapping=document.createElement("a");mapping.href=p.mapping_source;mapping.textContent="MapCode 來源";mapping.target="_blank";mapping.rel="noreferrer";official.append(mapping)}const route=document.createElement("div");route.className="route-summary";route.innerHTML="<strong>前一站至本站</strong><p>正在準備路線資訊…</p>";content.append(typ function showLeg(stageIndex,summary){const requestId=++routeRequestId,stage=stages[stageIndex],previous=stages[stageIndex-1],to=places.find(p=>p.id===stage?.place);if(routeLayer&&map){map.removeLayer(routeLayer);routeLayer=null}if(endpointLayer&&map){map.removeLayer(endpointLayer);endpointLayer=null}Object.values(markers).forEach(marker=>{if(map&&!map.hasLayer(marker))map.addLayer(marker);marker.setOpacity(.55)});if(!previous){summary.querySelector("p").textContent="此為行程起點。地圖已聚焦起點位置。";if(map&&to){map.setView(to.coords,14,{animate:true});if(markers[to.id])map.removeLayer(markers[to.id]);const rootEndpoint=L.circleMarker(to.coords,{radius:9,color:"#fff",weight:3,fillColor:"#dc2626",fillOpacity:1}).bindPopup("<strong>"+to.name+"</strong><br>車用 MapCode：<strong>"+(to.mapcode||"未提供")+"</strong>").bindTooltip(placeNumberLabel(to.id)+" 目前站點："+to.name,{permanent:true,direction:"top",offset:[0,-8],className:"route-endpoint-label"}).addTo(endpointLayer=L.layerGroup().addTo(map));updateMapcodeLabels()}return}const from=places.find(p=>p.id===previous.place);if(!from||!to)return;if(stage.mode==="info"){summary.querySelector("p").textContent=stage.route_note||stage.text||"此為行程資訊點，未繪製道路路線。";if(map){map.setView(to.coords,15,{animate:true});if(markers[to.id])map.removeLayer(markers[to.id]);const infoEndpoint=L.circleMarker(to.coords,{radius:9,color:"#fff",weight:3,fillColor:"#b45309",fillOpacity:1}).bindPopup("<strong>"+to.name+"</strong><br>"+(stage.text||"")).addTo(endpointLayer=L.layerGroup().addTo(map));infoEndpoint.bindTooltip(placeNumberLabel(to.id)+" 資訊點："+to.name,{permanent:true,direction:"top",offset:[0,-8],className:"route-endpoint-label"})}return}if(stage.mode==="walking"){summary.querySelector("p").textContent=stage.route_note||"步行路段；地圖以直線表示，不代表實際步道。";if(map){routeLayer=L.polyline([from.coords,to.coords],{color:"#0f766e",weight:4,dashArray:"6 8",opacity:.8}).addTo(map);markRouteEndpoints(from,to);map.fitBounds(routeLayer.getBounds().pad(.25),{maxZoom:15})}return}if(stage.mode==="ferry"){summary.querySelector("p").textContent="一般渡輪航段：船程時間與票價依實際班次公告確認；此段非自駕路線。";if(map){routeLayer=L.polyline([from.coords,to.coords],{color:"#0f766e",weight:4,dashArray:"8 8",opacity:.8}).addTo(map);markRouteEndpoints(from,to);map.fitBounds(routeLayer.getBounds().pad(.25),{maxZoom:12})}return}summary.querySelector("p").textContent="正在計算「"+from.name+" → "+to.name+"」的估計車程…";if(!map)return;markRouteEndpoints(from,to);const pair=from.coords[1]+","+from.coords[0]+";"+to.coords[1]+","+to.coords[0],url="https://router.project-osrm.org/route/v1/driving/"+pair+"?overview=full&geometries=geojson&steps=false";fetch(url).then(r=>{if(!r.ok)throw new Error("路線服務暫時無法使用");return r.json()}).then(data=>{if(requestId!==routeRequestId)return;if(data.code!=="Ok"||!data.routes?.length)throw new Error("找不到可用的道路路線");const route=data.routes[0];routeLayer=L.geoJSON(route.geometry,{style:{color:"#2459a6",weight:6,opacity:.9}}).addTo(map);map.fitBounds(routeLayer.getBounds().pad(.12),{maxZoom:15});Object.values(markers).forEach(m=>m.setOpacity(.35));const minutes=Math.max(1,Math.round(route.duration/60)),distance=(route.distance/1000).toFixed(1);summary.querySelector("p").textContent="「"+from.name+" → "+to.name+"」估計車程約 "+minutes+" 分鐘（約 "+distance+" 公里）。估算依道路資料，未含即時交通、停車與道路狀況。"}).catch(error=>{if(requestId!==routeRequestId)return;summary.querySelector("p").textContent=error.message+"；可改用地圖連結查詢。";map.fitBounds(L.latLngBounds(from.coords,to.coords).pad(.25),{maxZoom:13})})}
function renderPlan(){timeline.replaceChildren();const nodes=[];stages.forEach((s,i)=>{const node=document.createElement("details");node.className="timeline-node";const summary=document.createElement("summary");const time=document.createElement("span");time.className="node-time";time.textContent=s.time;const title=document.createElement("span");title.className="node-title";title.textContent=(i+1)+". "+s.title;summary.append(time,title);const content=document.createElement("div");content.className="node-content";const note=document.createElement("p");note.textContent=s.text;const tag=document.createElement("p");tag.className="node-kind";tag.textContent=s.tag;content.append(note,tag);node.append(summary,content);node.addEventListener("toggle",()=>{if(node.open){nodes.forEach(other=>{if(other!==node)other.open=false});showDetail(s.place,i,content)}});timeline.append(node);nodes.push(node)});if(window.L){if(!map){map=L.map("map",{scrollWheelZoom:false}).setView([34.493,134.245],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);map.on("zoomend moveend",updateMapcodeLabels)}Object.values(markers).forEach(m=>map.removeLayer(m));markers={};places.forEach(p=>{const numberedIcon=L.divIcon({className:"numbered-map-pin",html:"<span>"+placeNumberLabel(p.id)+"</span>",iconSize:[36,28],iconAnchor:[18,14],popupAnchor:[0,-13]});const m=L.marker(p.coords,{icon:numberedIcon}).addTo(map).bindPopup("<strong>"+p.name+"</strong><br>"+p.kind);m.setOpacity(.55);markers[p.id]=m;m.on("click",()=>{const i=stages.findIndex(s=>s.place===p.id),index=Math.max(0,i);nodes[index].open=true;showDetail(p.id,index,nodes[index].querySelector(".node-content"))})});map.fitBounds(places.map(p=>p.coords),{padding:[24,24]});updateMapcodeLabels();setTimeout(()=>map.invalidateSize(),100)}else{document.querySelector("#map").innerHTML='<div style="padding:30px;color:#475569">地圖圖磚目前無法載入。請使用各節點中的 OpenStreetMap 或 Google 地圖連結查看座標。</div>'}}

fetch("/07_Shikoku_Travel_Plan_Deck/days/2026-11-17/plans/2026-11-shikoku-1117-plan-b_v1.1.0_plan.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("無法載入旅行計畫資料");return r.json()}).then(plan=>{document.dispatchEvent(new CustomEvent("travel:day-loaded",{detail:{date:plan.date}}));places=plan.places.map(p=>{const coords=[p.latitude,p.longitude];return{...p,coords,map:"https://www.openstreetmap.org/?mlat="+p.latitude+"&mlon="+p.longitude+"#map=15/"+p.latitude+"/"+p.longitude}});stages=plan.stages.map((s,i)=>({...s,place:s.place_id,mode:s.mode||(i===0?"start":"driving")}));document.querySelector(".eyebrow").textContent=plan.date+" · "+plan.destination;document.querySelector("h1").textContent=plan.plan_name;document.querySelector(".hero-date").textContent=plan.weekday+" · 自駕行程";const cardBox=document.querySelector("#transport-cards");cardBox.replaceChildren(...plan.transport_cards.map(card=>{const article=document.createElement("article"),heading=document.createElement("h3"),body=document.createElement("p");article.className="transport-card";heading.textContent=card.title;body.textContent=card.text;article.append(heading,body);return article}));const tideBox=document.querySelector(".tide");tideBox.replaceChildren(...plan.tide_windows.map(t=>{const item=document.createElement("div"),label=document.createElement("span"),time=document.createElement("strong");label.textContent=t.label;time.textContent=t.time;item.append(label,time);return item}));document.querySelector(".tide").previousElementSibling.textContent=plan.tide_note;const sources=document.querySelector(".sources");sources.replaceChildren(document.createTextNode("官方資訊與地點資料："),...plan.sources.flatMap((s,i)=>{const a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noreferrer";a.textContent=s.label;const sep=document.createTextNode(i===plan.sources.length-1?"。":"、");return[a,sep]}));renderPlan()}).catch(error=>{timeline.textContent=error.message;document.querySelector("#map").textContent="Unable to load itinerary data. Check the plan files in this deck."});
